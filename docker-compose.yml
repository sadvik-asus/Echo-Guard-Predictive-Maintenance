version: '3.8'

services:
  echoguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echoguard-dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - SAMPLE_RATE=20000
    volumes:
      - ./data/samples:/app/data/samples:ro
      - ./models:/app/models
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
